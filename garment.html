<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eudaemon: garment passport</title>
<meta name="theme-color" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eudaemon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>

body{margin:0;font-family:'Manrope',sans-serif;background:#F7F5F0;color:#1C1F21}
a{color:#1C1F21}a:hover{color:#7A5A2E}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6A6258}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid #E4DED3}
.kv span:first-child{color:#6A6258}
.kv span:last-child{font-weight:600;text-align:right}

html,body{height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#EDEAE2}
nav{padding-bottom:env(safe-area-inset-bottom);height:auto!important;min-height:76px}
header{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>
<div style="width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: #F7F5F0; overflow: hidden">
  <div style="position: relative; height: 290px; flex-shrink: 0; background: #E3E3E1">
    <img src="assets/8a6753c1d7.jpg" alt="Worko Trouser in ash grey" style="width: 390px; height: 290px; object-fit: contain; display: block">
    <a href="wardrobe.html" aria-label="Back to wardrobe" style="position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1F21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </div>
  <main style="min-height: 0; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch">
    <div>
      <div class="cap">Garment passport</div>
      <div style="font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 4px">Worko Trouser, ash grey</div>
      <div style="font-size: 14px; color: #4F4940; margin-top: 4px">[Composition] · mid waist</div>
    </div>
    <div>
      <div class="kv"><span>Made for you</span><span>24 Apr 2026</span></div>
      <div class="kv"><span>Fabric</span><span>[Fabric code]</span></div>
      <div class="kv"><span>Cut and finished by</span><span>[Artisan name]</span></div>
      <div class="kv"><span>Handwork</span><span>[Hours] hours</span></div>
      <div class="kv"><span>Care</span><span>Dry clean · steam between wears</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="cap">Wears well with</div>
      <div style="display: flex; gap: 8px">
        <img src="assets/26c4de92af.jpg" alt="Nomad Jacket, rich navy" style="width: 64px; height: 80px; border-radius: 10px; object-fit: cover; object-position: center 30%">
        <img src="assets/21d4a74a5f.jpg" alt="Cut-away shirt, pure white" style="width: 64px; height: 80px; border-radius: 10px; object-fit: cover; object-position: center 35%">
        <img src="assets/76dafeae77.jpg" alt="Button-down shirt, ice blue" style="width: 64px; height: 80px; border-radius: 10px; object-fit: cover; object-position: center 30%">
      </div>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #1C1F21; color: #FFFFFF; font: 700 15px 'Manrope', sans-serif">Make this again in a new fabric</button>
      <button type="button" style="height: 48px; border: 1px solid #1C1F21; border-radius: 12px; background: transparent; color: #1C1F21; font: 700 14px 'Manrope', sans-serif">Request an alteration or pressing</button>
    </div>
  </main>
</div>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');</script>
</body></html>
